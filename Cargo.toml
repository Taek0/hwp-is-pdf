[package]
name = "hwp-engine"
version = "0.1.0"
edition = "2024"
description = "Independent HWP 5 / HWPX reader and vector PDF renderer"
license = "MIT"
repository = "https://github.com/Taek0/hwp-is-pdf"

[dependencies]
anyhow = "1"
encoding_rs = "0.8"
roxmltree = "0.21"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
cfb = "0.15"
crc32fast = "1"
aes = "0.8"
hwp-legacy-chart = {path="vendor/legacy-chart"}
ttf-parser = "0.25"
rustybuzz = "0.20.1"
unicode-bidi = "0.3.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
tiny-skia = "0.11.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

